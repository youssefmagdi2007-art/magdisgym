<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Magdi's Gym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .signin-card {
            max-width: 420px;
            width: 100%;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            margin: 20px auto;
        }
        .signin-card .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .signin-card .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0d6efd;
        }
        .signin-card .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
        }
        .signin-card .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
        }
        .btn-primary {
            background: #0d6efd;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #0b5ed7;
        }
        .signin-card .signup-link {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }
        .signin-card .signup-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="signin-card">
    <div class="logo">
        <h1>🏋️ Magdi's Gym</h1>
        <p class="text-muted">Welcome back. Please sign in.</p>
    </div>

    <form id="loginForm">
        {% csrf_token %}
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>

    <div id="loginError" class="alert alert-danger d-none mt-3"></div>

    <p class="mt-3 text-center text-muted small">
        Don't have an account? <a href="{% url 'register_step1' %}" class="signup-link">Register here</a>
    </p>
</div>

<script>
function getCSRFToken() {
    const cookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
    return cookie ? cookie.split('=')[1] : '';
}

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');
    errorDiv.classList.add('d-none');

    fetch('/login/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCSRFToken() },
        body: JSON.stringify({ email, password })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            localStorage.setItem('token', data.access);
            localStorage.setItem('refresh', data.refresh);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/';
        } else {
            errorDiv.textContent = data.error || 'Invalid credentials';
            errorDiv.classList.remove('d-none');
        }
    })
    .catch(() => {
        errorDiv.textContent = 'Something went wrong. Please try again.';
        errorDiv.classList.remove('d-none');
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
