<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Step 1 - Magdi's Gym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .register-card {
            max-width: 480px;
            width: 100%;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            margin: 20px auto;
        }
        .register-card .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .register-card .logo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0d6efd;
        }
        .register-card .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #dee2e6;
        }
        .register-card .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
        }
        .btn-primary {
            background: #0d6efd;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #0b5ed7;
        }
        .signin-link {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 500;
        }
        .signin-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="logo">
        <h1>🏋️ Magdi's Gym</h1>
        <p class="text-muted">Welcome! Let's get started.</p>
    </div>

    <form id="step1Form">
        <div class="mb-3 text-start">
            <label for="firstName" class="form-label fw-semibold">First Name</label>
            <input type="text" class="form-control" id="firstName" placeholder="Enter your first name" required>
        </div>

        <div class="mb-3 text-start">
            <label for="lastName" class="form-label fw-semibold">Last Name</label>
            <input type="text" class="form-control" id="lastName" placeholder="Enter your last name" required>
        </div>

        <div class="mb-3 text-start">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Continue</button>
    </form>

    <div id="step1Error" class="alert alert-danger d-none mt-3"></div>

    <p class="mt-3 text-center text-muted small">
        Already have an account? <a href="{% url 'signin' %}" class="signin-link">Sign in here</a>
    </p>
</div>

<script>
document.getElementById('step1Form').addEventListener('submit', function(e) {
    e.preventDefault();
    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const errorDiv = document.getElementById('step1Error');
    errorDiv.classList.add('d-none');

    if (!firstName || !lastName || !email) {
        errorDiv.textContent = 'Please fill in all fields.';
        errorDiv.classList.remove('d-none');
        return;
    }
    if (!email.includes('@')) {
        errorDiv.textContent = 'Please enter a valid email address.';
        errorDiv.classList.remove('d-none');
        return;
    }

    localStorage.setItem('reg_first_name', firstName);
    localStorage.setItem('reg_last_name', lastName);
    localStorage.setItem('reg_email', email);
    window.location.href = "{% url 'register_step2' %}";
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
